<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chon Thoi Han - Get Key VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#00e5ff;--purple:#a855f7;--pink:#ff2d95;--green:#00ff88;--bg1:#05050a;--border:#252545;--text:#e8e8ff;--muted:#6b6b8a;--input-bg:#0d0d14}
html,body{height:100%;font-family:Rajdhani,sans-serif;background:var(--bg1);color:var(--text);overflow-x:hidden}
.bg-anim{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,rgba(0,229,255,.12),transparent 40%),radial-gradient(circle at 80% 80%,rgba(168,85,247,.12),transparent 40%),var(--bg1)}
.bg-anim::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite}
@keyframes gridMove{to{transform:translate(50px,50px)}}
.particle{position:fixed;width:3px;height:3px;background:var(--cyan);border-radius:50%;pointer-events:none;opacity:.5;box-shadow:0 0 10px var(--cyan);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-10vh) scale(1);opacity:0}}
.container{max-width:520px;margin:0 auto;padding:30px 20px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:100%;background:linear-gradient(145deg,rgba(22,22,42,.95),rgba(15,15,26,.98));border:1px solid var(--border);border-radius:24px;padding:35px 28px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;background:linear-gradient(45deg,var(--cyan),var(--purple),var(--pink),var(--cyan));background-size:400% 400%;border-radius:24px;z-index:-1;opacity:.4;animation:borderGlow 8s ease infinite;filter:blur(8px)}
@keyframes borderGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.header{text-align:center;margin-bottom:25px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);border-radius:100px;font-size:.7rem;color:var(--cyan);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:15px}
.badge::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green);animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.3}}
.title{font-family:Orbitron,sans-serif;font-size:1.8rem;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;letter-spacing:2px;margin-bottom:6px}
@keyframes shine{to{background-position:200% center}}
.subtitle{color:var(--muted);font-size:.85rem;letter-spacing:1px}
.duration-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px}
.dur-card{background:var(--input-bg);border:2px solid var(--border);border-radius:16px;padding:24px 16px;cursor:pointer;transition:all .3s;text-align:center}
.dur-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,229,255,.2)}
.dur-card.active{border-color:var(--cyan);background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(168,85,247,.1));box-shadow:0 0 30px rgba(0,229,255,.3)}
.dur-num{font-family:Orbitron,sans-serif;font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.dur-unit{font-size:.8rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.dur-desc{font-size:.75rem;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:Rajdhani,sans-serif;font-size:1rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .25s;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;box-shadow:0 10px 30px rgba(0,229,255,.3);margin-top:10px}
.btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,229,255,.5)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-back{background:var(--input-bg);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn-back:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:20px;font-size:.7rem;color:var(--muted);letter-spacing:1px}
.footer span{color:var(--cyan)}
</style>
</head>
<body>
<div class="bg-anim"></div>
<div class="container">
<div class="card">
<div class="header">
<div class="badge">Step 2 / 3</div>
<h1 class="title">CHON THOI HAN</h1>
<p class="subtitle">Chon thoi gian hieu luc cua key</p>
</div>
<div class="duration-grid">
<div class="dur-card" data-duration="12">
<div class="dur-num">12</div>
<div class="dur-unit">Gio</div>
<div class="dur-desc">Vuot 1 lan</div>
</div>
<div class="dur-card active" data-duration="24">
<div class="dur-num">24</div>
<div class="dur-unit">Gio</div>
<div class="dur-desc">Vuot 2 lan</div>
</div>
</div>
<button class="btn" id="btnNext" onclick="goBypass()">TIEP TUC VUOT LINK</button>
<button class="btn btn-back" onclick="location.href='/'">QUAY LAI</button>
<div class="footer">Powered by <span>ANHKHOA System</span> - v8.0 VIP</div>
</div>
</div>
<script>
var duration = 24;
(function(){for(var i=0;i<20;i++){var p=document.createElement("div");p.className="particle";p.style.left=Math.random()*100+"%";p.style.animationDuration=(5+Math.random()*10)+"s";p.style.animationDelay=Math.random()*5+"s";if(Math.random()>0.5){p.style.background="#a855f7";p.style.boxShadow="0 0 10px #a855f7"}document.body.appendChild(p)}})();
document.querySelectorAll("[data-duration]").forEach(function(el){el.addEventListener("click",function(){document.querySelectorAll("[data-duration]").forEach(function(e){e.classList.remove("active")});el.classList.add("active");duration=parseInt(el.dataset.duration)})});

function getFingerprint(){
    return new Promise(function(resolve){
        try{
            var canvas = document.createElement("canvas");
            var ctx = canvas.getContext("2d");
            ctx.textBaseline = "top";
            ctx.font = "14px Arial";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = "#069";
            ctx.fillText("Fingerprint", 2, 15);
            ctx.fillStyle = "rgba(102,204,0,0.7)";
            ctx.fillText("Fingerprint", 4, 17);
            var data = canvas.toDataURL();
            var gl = document.createElement("canvas").getContext("webgl");
            var debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
            var gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "unknown";
            var raw = data + "|" + gpu + "|" + navigator.userAgent + "|" + screen.width + "x" + screen.height + "|" + navigator.language;
            var hash = 0;
            for(var i=0;i<raw.length;i++){hash=((hash<<5)-hash)+raw.charCodeAt(i);hash=hash&hash}
            resolve("FP-" + Math.abs(hash).toString(36));
        }catch(e){resolve("FP-" + Math.random().toString(36).substring(2))}
    });
}

async function goBypass(){
    var btn = document.getElementById("btnNext");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Dang chuan bi...';
    try{
        var fp = await getFingerprint();
        localStorage.setItem("device_fp", fp);
        var res = await fetch("/api/start", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify({game: "freefire", duration: duration, device_fp: fp})
        });
        var data = await res.json();
        if(data.ok){window.location.href = data.bypass_url}
        else{alert("Loi: " + data.error);btn.disabled=false;btn.innerHTML='TIEP TUC VUOT LINK'}
    } catch(e){
        alert("Loi ket noi: " + e.message);
        btn.disabled = false;
        btn.innerHTML = 'TIEP TUC VUOT LINK';
    }
}
</script>
</body>
</html>
