<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05040b"><title>Chọn thời hạn • ANHKHOA</title><style>
:root{--bg:#05040b;--panel:#0c0b16;--panel2:#111020;--line:#26233d;--purple:#9b5cff;--violet:#6d3df5;--cyan:#55e7ff;--green:#45f0a0;--red:#ff5577;--text:#f5f3ff;--muted:#8d88a8;--shadow:0 24px 80px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 10%,rgba(155,92,255,.18),transparent 34%),radial-gradient(circle at 90% 85%,rgba(85,231,255,.12),transparent 30%),#05040b}.grid{position:fixed;inset:0;z-index:-1;opacity:.25;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent)}
.wrap{width:min(560px,calc(100% - 28px));min-height:100vh;margin:auto;display:flex;align-items:center;justify-content:center;padding:28px 0}.card{width:100%;padding:26px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(18,16,31,.97),rgba(9,8,16,.98));box-shadow:var(--shadow);position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:12%;right:12%;top:-90px;height:150px;background:rgba(155,92,255,.18);filter:blur(55px);pointer-events:none}.top{text-align:center;position:relative}.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#9b5cff,#5e36d8);box-shadow:0 12px 35px rgba(155,92,255,.35);font-size:30px}.eyebrow{display:inline-flex;gap:7px;align-items:center;padding:6px 11px;border:1px solid rgba(155,92,255,.3);background:rgba(155,92,255,.08);border-radius:999px;color:#cbb8ff;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}h1{font-size:27px;line-height:1.15;margin:13px 0 7px;letter-spacing:.4px}h1 span{background:linear-gradient(90deg,#fff,#c7b4ff,var(--cyan));-webkit-background-clip:text;color:transparent}.sub{color:var(--muted);font-size:13px;line-height:1.55}.steps{display:flex;gap:7px;margin:22px 0}.step{height:5px;flex:1;border-radius:99px;background:#242039}.step.on{background:linear-gradient(90deg,var(--purple),var(--cyan));box-shadow:0 0 15px rgba(155,92,255,.25)}.section{margin-top:22px}.label{font-size:11px;font-weight:800;color:#aaa4c2;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}.choice{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.018);transition:.2s}.choice.active{border-color:rgba(155,92,255,.75);background:linear-gradient(135deg,rgba(155,92,255,.13),rgba(85,231,255,.04));box-shadow:0 10px 30px rgba(0,0,0,.2)}.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ff7138,#d52e66);font-size:23px;flex:none}.choice b{font-size:15px}.choice small{display:block;color:var(--muted);margin-top:3px;font-size:12px}.badge{margin-left:auto;padding:6px 9px;border-radius:9px;background:rgba(69,240,160,.08);border:1px solid rgba(69,240,160,.2);color:var(--green);font-size:10px;font-weight:800}.duration{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dur{padding:19px 14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.018);text-align:center;cursor:pointer;transition:.2s}.dur.active{border-color:var(--purple);background:linear-gradient(145deg,rgba(155,92,255,.16),rgba(85,231,255,.04));box-shadow:0 10px 30px rgba(110,61,245,.18)}.num{font-size:30px;font-weight:900;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;color:transparent}.unit{font-size:11px;color:#aaa4c2;font-weight:800;letter-spacing:1px}.desc{font-size:11px;color:var(--muted);margin-top:7px}.btn{width:100%;border:0;border-radius:15px;padding:15px 16px;margin-top:12px;font-size:13px;font-weight:900;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,#8b4fff,#6436dd);box-shadow:0 12px 30px rgba(110,61,245,.28);cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}.btn:disabled{opacity:.6;transform:none;cursor:wait}.btn.alt{background:#111020;border:1px solid var(--line);box-shadow:none;color:#dcd7ee}.status{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:12px}.status.show{display:block}.status.ok{color:var(--green);background:rgba(69,240,160,.07);border:1px solid rgba(69,240,160,.18)}.status.bad{color:#ff7d97;background:rgba(255,85,119,.07);border:1px solid rgba(255,85,119,.18)}.foot{text-align:center;color:#625e78;font-size:10px;letter-spacing:.8px;margin-top:19px}.foot b{color:#9b8bbf}.key{padding:20px 14px;border:1px solid rgba(69,240,160,.38);border-radius:17px;background:#080d0c;color:var(--green);font:800 18px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;text-align:center;word-break:break-all;box-shadow:inset 0 0 30px rgba(69,240,160,.04),0 0 30px rgba(69,240,160,.08)}.notice{margin-top:14px;padding:13px;border-radius:14px;background:rgba(155,92,255,.06);border:1px solid rgba(155,92,255,.18);font-size:12px;color:#aaa4c2;line-height:1.55}.notice b{color:#ddd6f2}.copy{background:linear-gradient(135deg,#22d98a,#13a96c)}.back{margin-top:9px}.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:420px){.wrap{width:min(100% - 18px,560px);padding:16px 0}.card{padding:22px 17px;border-radius:22px}h1{font-size:23px}.duration{gap:9px}.dur{padding:16px 9px}.num{font-size:27px}.key{font-size:15px;letter-spacing:1.4px}}
</style></head><body><div class="bg"></div><div class="grid"></div><main class="wrap"><section class="card"><div class="top"><div class="logo">⏱</div><div class="eyebrow"><i class="dot"></i> STEP 2 / 3</div><h1><span>THỜI HẠN KEY</span></h1><p class="sub">Chọn thời gian sử dụng trước khi tiếp tục.</p></div><div class="steps"><i class="step on"></i><i class="step on"></i><i class="step"></i></div><div class="section"><div class="label">02 / Thời gian</div><div class="duration"><div class="dur" data-duration="12"><div class="num">12</div><div class="unit">GIỜ</div><div class="desc">1 lần vượt link</div></div><div class="dur active" data-duration="24"><div class="num">24</div><div class="unit">GIỜ</div><div class="desc">2 lần vượt link</div></div></div></div><button class="btn" id="go" onclick="goBypass()">TIẾP TỤC VƯỢT LINK →</button><button class="btn alt" onclick="location.href='/'">← QUAY LẠI</button><div class="status" id="status"></div><div class="foot">Key được ràng buộc theo fingerprint thiết bị</div></section></main><script>var duration=24;document.querySelectorAll('[data-duration]').forEach(function(x){x.onclick=function(){document.querySelectorAll('[data-duration]').forEach(function(y){y.classList.remove('active')});x.classList.add('active');duration=Number(x.dataset.duration)}});function fp(){try{var s=[navigator.userAgent,screen.width,screen.height,navigator.language,navigator.platform,Intl.DateTimeFormat().resolvedOptions().timeZone].join('|');var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'FP-'+(h>>>0).toString(36)}catch(e){return 'FP-'+Math.random().toString(36).slice(2)}}async function goBypass(){var b=document.getElementById('go'),st=document.getElementById('status');b.disabled=true;b.innerHTML='<span class="spinner"></span> ĐANG CHUẨN BỊ...';st.className='status';try{var f=fp();localStorage.setItem('device_fp',f);var r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({game:'freefire',duration:duration,device_fp:f})});var d=await r.json();if(d.ok){location.href=d.bypass_url}else{throw new Error(d.error||'Không thể tạo phiên')}}catch(e){st.className='status bad show';st.textContent=e.message;b.disabled=false;b.textContent='TIẾP TỤC VƯỢT LINK →'}}</script></body></html>
