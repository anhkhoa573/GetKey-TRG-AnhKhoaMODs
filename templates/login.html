<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05040b"><title>Admin • ANHKHOA</title><style>
:root{--bg:#05040b;--panel:#0d0b18;--line:#28243f;--p:#9b5cff;--c:#55e7ff;--g:#45f0a0;--r:#ff5577;--t:#f6f3ff;--m:#918ba9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#241341 0,transparent 35%),radial-gradient(circle at 90% 90%,#09242b 0,transparent 30%),var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}.card{width:min(430px,calc(100% - 28px));padding:28px;border:1px solid var(--line);border-radius:26px;background:rgba(13,11,24,.94);box-shadow:0 30px 90px #0009}.logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,var(--p),#5c35d8);font-size:30px;box-shadow:0 15px 35px #9b5cff44;margin:auto}.ey{display:block;width:max-content;margin:15px auto 0;padding:6px 11px;border:1px solid #9b5cff44;border-radius:99px;color:#cabaff;font-size:10px;font-weight:900;letter-spacing:1.5px}h1{text-align:center;margin:15px 0 6px;font-size:27px}p{text-align:center;color:var(--m);font-size:13px}.field{width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;background:#080711;color:var(--t);outline:0;margin-top:18px}.field:focus{border-color:var(--p);box-shadow:0 0 0 3px #9b5cff18}.btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;background:linear-gradient(135deg,var(--p),#6235dd);color:white;font-weight:900;cursor:pointer}.err{margin-top:12px;padding:11px;border-radius:12px;background:#ff557712;border:1px solid #ff557733;color:#ff8ba1;font-size:12px;text-align:center}.foot{text-align:center;color:#605a72;font-size:10px;margin-top:18px}
</style></head><body><form class="card" method="post"><div class="logo">🛡️</div><span class="ey">ANHKHOA ADMIN PANEL</span><h1>Quản lý Get Key</h1><p>Đăng nhập khu vực quản trị.</p><input class="field" name="password" type="password" placeholder="Mật khẩu admin" autocomplete="current-password" required><button class="btn">ĐĂNG NHẬP →</button>{% if error %}<div class="err">{{ error }}</div>{% endif %}<div class="foot">TRG MODs • Secure Admin</div></form></body></html>
